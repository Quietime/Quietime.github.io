# Quietime 静夜工作室 管理后台（Sveltia CMS，兼容 Decap CMS 配置）
# 登录方式：选择“Sign In Using Access Token / 使用访问令牌登录”，填入 GitHub 个人访问令牌。
# 每次保存都会提交到 main 分支，GitHub Actions 约两分钟后自动发布。
# 文字分中文、English、日本語三栏。外文留空时，网站会先显示中文。
backend:
  name: github
  repo: Quietime/quietime.github.io
  branch: main
  commit_messages:
    create: '新增 {{collection}}：{{slug}}'
    update: '更新 {{collection}}：{{slug}}'
    delete: '删除 {{collection}}：{{slug}}'
    uploadMedia: '上传 {{path}}'
    deleteMedia: '删除 {{path}}'

site_url: https://quietime.github.io
display_url: https://quietime.github.io
logo:
  src: /favicon.svg

media_folder: content/uploads
public_folder: /content/uploads

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: series
    label: 作品系列
    label_singular: 系列
    description: 每个系列一个文件夹。照片上传后会和系列放在一起，网站会自动生成各种尺寸。建议上传长边 2400 到 3000 像素、5MB 以内的 JPG。三种语言请各自意译，不必逐字对应。
    folder: content/series
    path: '{{slug}}/index'
    format: json
    extension: json
    create: true
    delete: true
    identifier_field: title_en
    summary: '{{title_zh}}　{{title_en}}'
    sortable_fields: [order, title_zh]
    media_folder: ''
    public_folder: ''
    fields:
      - { name: title_zh, label: 标题（中文）, widget: string }
      - { name: title_en, label: Title (English), widget: string, hint: 第一次保存时会用它生成网址，之后改标题不会改变网址 }
      - { name: title_ja, label: タイトル（日本語）, widget: string, required: false }
      - { name: order, label: 排序, widget: number, value_type: int, default: 100, hint: 数字小的排在前面 }
      - { name: draft, label: 暂不发布, widget: boolean, default: false, required: false }
      - { name: statement_zh, label: 系列自述（中文）, widget: text, required: false }
      - { name: statement_en, label: Statement (English), widget: text, required: false }
      - { name: statement_ja, label: ステートメント（日本語）, widget: text, required: false }
      - name: meta
        label: 拍摄信息
        label_singular: 一项
        widget: list
        required: false
        summary: '{{k_zh}}　{{v_zh}}'
        hint: 例如 相机 Leica M6，胶片 Portra 400，地点 吉林。画格数量会自动计算。
        fields:
          - { name: k_zh, label: 项目（中文）, widget: string }
          - { name: v_zh, label: 内容（中文）, widget: string }
          - { name: k_en, label: Item (English), widget: string, required: false }
          - { name: v_en, label: Value (English), widget: string, required: false }
          - { name: k_ja, label: 項目（日本語）, widget: string, required: false }
          - { name: v_ja, label: 内容（日本語）, widget: string, required: false }
      - name: bulk
        label: 批量添加照片
        widget: image
        multiple: true
        required: false
        hint: 一次选好多张，或直接把照片拖进来，按选择的顺序排在下面"照片"之后。首页这一卷的长度、作品页和系列页都会按张数自动生成。要给某张写说明，就把它加到下面"照片"里。
      - name: frames
        label: 照片
        label_singular: 一张照片
        widget: list
        required: false
        summary: '{{caption_zh}}'
        hint: 一张一张添加，可以写说明、选排法，按观看顺序排列，可以拖动调整。
        fields:
          - { name: image, label: 照片, widget: image }
          - { name: caption_zh, label: 说明（中文）, widget: string, required: false }
          - { name: caption_en, label: Caption (English), widget: string, required: false }
          - { name: caption_ja, label: キャプション（日本語）, widget: string, required: false }
          - name: layout
            label: 排法
            widget: select
            default: right
            options:
              - { label: 宽幅居中, value: wide }
              - { label: 偏右单张, value: right }
              - { label: 偏左单张, value: left }
              - { label: 小图, value: small }
              - { label: 与下一张并排, value: pair }

  - name: pages
    label: 网站设置
    files:
      - name: films
        label: B站影像
        file: content/films.json
        format: json
        media_folder: /content/films
        public_folder: /content/films
        fields:
          - name: films
            label: 影片
            label_singular: 一部影片
            widget: list
            summary: '{{title_zh}}　{{bvid}}'
            fields:
              - { name: bvid, label: B站视频, widget: text, required: false, hint: 粘贴 BV 号、视频链接，或 B站“分享 → 嵌入代码”都可以。网站构建时会自动读取标题、封面、时长和播放量。留空时显示“整理中”。 }
              - { name: title_zh, label: 片名（中文）, widget: string, required: false, hint: 留空就用 B站 上的标题 }
              - { name: title_en, label: Title (English), widget: string, required: false }
              - { name: title_ja, label: タイトル（日本語）, widget: string, required: false }
              - { name: kind_zh, label: 类型（中文）, widget: string, required: false, hint: 例如 短片、Vlog、幕后 }
              - { name: kind_en, label: Type (English), widget: string, required: false }
              - { name: kind_ja, label: 種類（日本語）, widget: string, required: false }
              - { name: cover, label: 封面, widget: image, required: false, hint: 留空就用 B站 封面。建议 16:9，1920×1080 }

      - name: settings
        label: 基本信息与联系方式
        file: content/settings.json
        format: json
        fields:
          - { name: name, label: 英文名, widget: string }
          - { name: name_zh, label: 中文名, widget: string }
          - { name: url, label: 网站地址, widget: string }
          - { name: description_zh, label: 网站简介（中文，搜索引擎显示）, widget: text }
          - { name: description_en, label: Description (English), widget: text, required: false }
          - { name: description_ja, label: サイトの説明（日本語）, widget: text, required: false }
          - { name: statement_zh, label: 片头的一句话（中文，可分行）, widget: text }
          - { name: statement_en, label: Opening line (English), widget: text, required: false }
          - { name: statement_ja, label: 冒頭のことば（日本語）, widget: text, required: false }
          - { name: hero_image, label: 首屏大字里的照片, widget: image, required: false, media_folder: /content/uploads, public_folder: /content/uploads, hint: 首页 QUIETIME 几个大字镂空透出的照片。建议横幅风景，2400 像素宽以上；留空就用第一个系列的第一张 }
          - { name: edge_code, label: 胶片边码文字, widget: string, hint: 印在每一格下方，例如 QUIETIME 400 }
          - { name: wechat, label: 微信号, widget: string, required: false }
          - { name: email, label: 邮箱, widget: string, required: false }
          - { name: wechat_qr, label: 微信二维码, widget: image, required: false, media_folder: /content/uploads, public_folder: /content/uploads }
          - { name: copyright, label: 版权声明, widget: string }
          - name: socials
            label: 社交平台
            label_singular: 一个平台
            widget: list
            summary: '{{label}}'
            hint: 填了链接才会显示在网站上。
            fields:
              - { name: label, label: 名称, widget: string }
              - { name: url, label: 链接, widget: string, required: false }
          - { name: home_teaser_zh, label: 首页“关于”一格的话（中文）, widget: text, required: false }
          - { name: home_teaser_en, label: Home about frame (English), widget: text, required: false }
          - { name: home_teaser_ja, label: ホームの紹介文（日本語）, widget: text, required: false }
          - { name: about_intro_zh, label: 关于页介绍（中文，段落之间空一行）, widget: text }
          - { name: about_intro_en, label: About (English), widget: text, required: false }
          - { name: about_intro_ja, label: スタジオについて（日本語）, widget: text, required: false }
          - name: services
            label: 服务项目
            label_singular: 一项服务
            widget: list
            summary: '{{title_zh}}'
            fields:
              - { name: title_zh, label: 名称（中文）, widget: string }
              - { name: text_zh, label: 说明（中文）, widget: string, required: false }
              - { name: title_en, label: Name (English), widget: string, required: false }
              - { name: text_en, label: Note (English), widget: string, required: false }
              - { name: title_ja, label: 名称（日本語）, widget: string, required: false }
              - { name: text_ja, label: 説明（日本語）, widget: string, required: false }
          - { name: contact_lede_zh, label: 联系页开头的一段话（中文）, widget: text, required: false }
          - { name: contact_lede_en, label: Contact intro (English), widget: text, required: false }
          - { name: contact_lede_ja, label: お問い合わせの前文（日本語）, widget: text, required: false }
          - { name: form_endpoint, label: 表单提交地址, widget: string, required: false, hint: 可选。填 Formspree 或 Web3Forms 的地址后，访客可以直接在网页里提交；留空则会生成一封邮件。 }
          - name: process
            label: 合作流程
            label_singular: 一步
            widget: list
            required: false
            summary: '{{title_zh}}'
            fields:
              - { name: title_zh, label: 名称（中文）, widget: string }
              - { name: text_zh, label: 说明（中文）, widget: text }
              - { name: title_en, label: Step (English), widget: string, required: false }
              - { name: text_en, label: Note (English), widget: text, required: false }
              - { name: title_ja, label: 名称（日本語）, widget: string, required: false }
              - { name: text_ja, label: 説明（日本語）, widget: text, required: false }
          - name: faq
            label: 常见问题
            label_singular: 一个问题
            widget: list
            required: false
            summary: '{{q_zh}}'
            fields:
              - { name: q_zh, label: 问题（中文）, widget: string }
              - { name: a_zh, label: 回答（中文）, widget: text }
              - { name: q_en, label: Question (English), widget: string, required: false }
              - { name: a_en, label: Answer (English), widget: text, required: false }
              - { name: q_ja, label: 質問（日本語）, widget: string, required: false }
              - { name: a_ja, label: 回答（日本語）, widget: text, required: false }
          - { name: music_on, label: 播放背景音乐, widget: boolean, required: false, hint: 访客第一次点击页面后淡入，右上角可以关闭 }
          - { name: music_file, label: 背景音乐文件, widget: file, required: false, media_folder: /content/uploads, public_folder: /content/uploads, hint: 可选，建议 MP3、5MB 以内、可以循环的曲子。留空则播放网站自带的氛围音乐。 }
          - { name: music_volume, label: 音量, widget: number, value_type: int, min: 5, max: 100, default: 40, required: false }
          - { name: samples, label: 目前使用示例照片, widget: boolean, required: false, hint: 换成自己的作品后关掉，示例说明就会消失 }
          - { name: sample_credit_zh, label: 示例照片来源（中文）, widget: text, required: false }
          - { name: sample_credit_en, label: Sample credit (English), widget: text, required: false }
          - { name: sample_credit_ja, label: サンプルの出典（日本語）, widget: text, required: false }
